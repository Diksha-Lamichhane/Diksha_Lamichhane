<section class="hero" id="hero">

  <!-- Background decoration -->
  <div class="hero-bg" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="container">
    <div class="hero-grid">

      <!-- ── Left: Content ─────────────────────────────────────── -->
      <div class="hero-content">

        <p class="hero-greeting" style="animation-delay: 0ms">
          <span class="wave" aria-hidden="true">👋</span>
          <span>Hello, I'm</span>
        </p>

        <h1 class="hero-name" style="animation-delay: 120ms">
          Diksha<br>
          <span class="gradient-text">Lamichhane</span>
        </h1>

        <div class="hero-role" style="animation-delay: 260ms" aria-live="polite">
          <span class="role-prefix">I'm a &nbsp; </span>
          <span class="role-text">{{ displayText() }}</span>
          <span class="hero-cursor" [style.opacity]="showCursor() ? 1 : 0" aria-hidden="true">|</span>
        </div>

        <p class="hero-description" style="animation-delay: 380ms">
          .NET Developer with 4+ years of experience building enterprise applications, RESTful APIs, and SQL Server solutions using C#, ASP.NET MVC/.NET Core, and Angular.
        </p>

        <div class="hero-ctas" style="animation-delay: 500ms">
          <a
            [href]="meta.resumeUrl"
            download="diksha-lamichhane-resume"
            class="btn btn-primary"
          >
            <span class="material-icons-round btn-icon">download</span>
            Download Resume
          </a>
          <button class="btn btn-outline" (click)="scrollTo('projects')">
            <span class="material-icons-round btn-icon">code</span>
            View Projects
          </button>
          <button class="btn btn-ghost" (click)="scrollTo('contact')">
            <span class="material-icons-round btn-icon">mail_outline</span>
            Contact Me
          </button>
        </div>

        <div class="hero-socials" style="animation-delay: 620ms">
          <a
            [href]="meta.github"
            target="_blank"
            rel="noopener noreferrer"
            class="social-link"
            aria-label="GitHub profile"
          >
            <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20" aria-hidden="true">
              <path d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"/>
            </svg>
          </a>
          <a
            [href]="meta.linkedin"
            target="_blank"
            rel="noopener noreferrer"
            class="social-link"
            aria-label="LinkedIn profile"
          >
            <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20" aria-hidden="true">
              <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>
            </svg>
          </a>
          <a
            [href]="'mailto:' + meta.email"
            class="social-link"
            aria-label="Send email"
          >
            <span class="material-icons-round" aria-hidden="true">mail_outline</span>
          </a>
        </div>

      </div><!-- /hero-content -->

      <!-- ── Right: Visual ─────────────────────────────────────── -->
      <div class="hero-visual" aria-hidden="true" style="animation-delay: 300ms">
        <div class="avatar-container">
          <div class="avatar-ring"></div>
          <div class="avatar">
            <span class="avatar-initials">DL</span>
          </div>

          <!-- Floating tech badges -->
          <span class="tech-float badge-1">C#</span>
          <span class="tech-float badge-2">.NET</span>
          <span class="tech-float badge-3">Angular</span>
          <span class="tech-float badge-4">SQL</span>
          <span class="tech-float badge-5">REST APIs</span>
        </div>
      </div>

    </div><!-- /hero-grid -->
  </div>

  <!-- Scroll indicator -->
  <button class="scroll-hint" (click)="scrollTo('about')" aria-label="Scroll to About section">
    <span>Scroll</span>
    <span class="material-icons-round scroll-arrow" aria-hidden="true">expand_more</span>
  </button>

</section>
